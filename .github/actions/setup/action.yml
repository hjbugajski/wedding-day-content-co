name: Setup
description: Install pnpm and Node.js, then install dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v5

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install
